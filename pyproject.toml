[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[project]
name = "cml-mcp"
version = "0.32.2"
license = "BSD-2-Clause AND LicenseRef-Proprietary"
license-files = ["LICENSE", "CISCO_LICENSE.md"]
authors = [{ name = "Joe Clarke", email = "jclarke@cisco.com" }]
description = "Cisco Modeling Labs CML MCP Server"
requires-python = ">=3.12,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx",
    "fastmcp>=3.1.1,<5",
    "fastapi",
    "pydantic_strict_partial",
    "typer",
    "virl2_client",
]
optional-dependencies = { "pyats" = [
    "pyats",
    "genie",
], "opentelemetry" = [
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
] }

[project.scripts]
cml-mcp = "cml_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/xorrkaz/cml-mcp"
Issues = "https://github.com/xorrkaz/cml-mcp/issues"

[tool.black]
line-length = 140
force-exclude = '''
^/src/cml_mcp/cml/
'''

[tool.isort]
profile = "black"
line_length = 140
skip_glob = ["src/cml_mcp/cml/**"]

[tool.uv.sources]
cml-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "inline-snapshot[black]",
    "black",
    "isort",
    "flake8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Enable this for debugging, but it will make the output very verbose
log_cli = false
filterwarnings = [
    # FastMCP 4 serializes tool return values with
    # TypeAdapter(return_type).dump_python(value, mode="json"). Tools intentionally return
    # Model(**raw).model_dump(exclude_unset=True) (a plain dict) instead of the model instance
    # itself -- see DEVELOPMENT.md "Object-typed return values" -- because several auto-generated
    # CML schemas declare a field as `SomeModel = Field(default=None)` (non-Optional type, None
    # default); dumping the real instance would serialize unset fields as `null` and fail FastMCP's
    # output-schema validation. Returning a dict instead is correct but not what a model-typed
    # TypeAdapter expects, so Pydantic logs this warning on every such call. It is expected noise.
    "ignore:Pydantic serializer warnings:UserWarning",
    # PyATS/Unicon opens CLI connections via pexpect's pty.fork(), which CPython 3.12 flags
    # whenever it runs in a process with other live threads -- true here because
    # send_cli_command/send_cli_config_command/get_console_log run _run_cli_command_sync via
    # asyncio.to_thread (see tools/cli.py) to avoid blocking the event loop. The forked child
    # execs immediately, so the deadlock window is negligible; this is expected and not
    # something cml-mcp can fix (PyATS/Unicon owns the pty.fork() call).
    "ignore:This process \\(pid=\\d+\\) is multi-threaded, use of forkpty\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning",
]
